<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hall of fame – Guess the Note</title>
    <link rel="icon" href="img/favicon.ico" sizes="any" />
    <link rel="icon" href="img/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="img/icon.png" />
    <link rel="canonical" href="https://guessthenote.vige.it/hall-of-fame.html" />
    <meta
      name="description"
      content="Global hall of fame for Guess the Note — top sight-reading scores."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#140f0c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/home.css" />
  </head>
  <body>
    <div class="app home hof-page">
      <header class="topbar home-topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">𝄞</span>
          <div>
            <h1 data-i18n="hallOfFameTitle">Hall of fame</h1>
            <p class="tagline" id="hofLead" data-i18n="hallOfFameLead">
              Top scores from players around the world.
            </p>
          </div>
        </div>
        <div class="toolbar page-toolbar">
          <a class="home-cta home-cta-secondary hof-play-link" href="play.html" data-i18n="homePlay">
            Play in the browser
          </a>
          <button
            type="button"
            class="settings-btn"
            id="settingsBtn"
            aria-haspopup="dialog"
            aria-expanded="false"
            aria-controls="settingsOverlay"
            data-i18n-aria="settings"
            aria-label="Settings"
          >
            ⚙
          </button>
        </div>
      </header>

      <div class="settings-overlay is-hidden" id="settingsOverlay">
        <div
          class="settings-dialog"
          role="dialog"
          aria-modal="true"
          aria-labelledby="settingsTitle"
        >
          <div class="settings-head">
            <h2 id="settingsTitle" data-i18n="settings">Settings</h2>
            <button type="button" class="settings-close" id="settingsClose" data-i18n="close">
              Close
            </button>
          </div>

          <section class="lang-bar" data-i18n-aria="language" aria-label="Language">
            <button type="button" data-lang="en" aria-pressed="false">EN</button>
            <button type="button" data-lang="it" aria-pressed="false">IT</button>
            <button type="button" data-lang="es" aria-pressed="false">ES</button>
            <button type="button" data-lang="pt" aria-pressed="false">PT</button>
            <button type="button" data-lang="de" aria-pressed="false">DE</button>
            <button type="button" data-lang="fr" aria-pressed="false">FR</button>
            <button type="button" data-lang="zh" aria-pressed="false">中文</button>
            <button type="button" data-lang="ja" aria-pressed="false">日本語</button>
          </section>

          <section class="controls hof-settings-controls" data-i18n-aria="settings" aria-label="Settings">
            <div class="tempo-field">
              <span class="tempo-heading">
                <span data-i18n="hallOfFameDisplayCount">Entries shown</span>
                <strong id="hofDisplayLabel">10</strong>
              </span>
              <div class="tempo-stepper">
                <input
                  id="hofDisplayCount"
                  type="range"
                  min="5"
                  max="50"
                  step="1"
                  value="10"
                  data-i18n-aria="hallOfFameDisplayCount"
                  aria-label="Entries shown"
                />
              </div>
            </div>
          </section>
        </div>
      </div>

      <main class="hof-main">
        <p class="hof-status" id="hofStatus" aria-live="polite"></p>
        <div id="hofTable" class="hof-table-host"></div>
      </main>

      <footer class="home-footer">
        <a href="index.html" data-i18n="home">Home</a>
        <a href="https://github.com/flashboss/guess_the_note" data-i18n="homeRepo">Source on GitHub</a>
      </footer>
    </div>

    <script src="js/i18n.js?v=20250901h"></script>
    <script src="js/page-settings.js?v=20250901h"></script>
    <script type="module" src="js/hall-of-fame-page.js?v=20250901i"></script>
  </body>
</html>
