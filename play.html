<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guess the Note</title>
    <link rel="icon" href="img/favicon.ico" sizes="any" />
    <link rel="icon" href="img/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="img/icon.png" />
    <meta
      name="description"
      content="Allena la lettura delle note sul pentagramma in chiave di violino e di basso."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">𝄞</span>
          <div>
            <h1 data-i18n="title">Guess the Note</h1>
            <p class="tagline" data-i18n="tagline">Sight-reading on the staff</p>
            <a class="home-link" href="index.html" data-i18n="home">Home</a>
          </div>
        </div>
        <div class="stats" aria-live="polite">
          <div class="stat">
            <span class="stat-value" id="progress">0/10</span>
            <span class="stat-label" data-i18n="rounds">Round</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="score">0</span>
            <span class="stat-label" data-i18n="score">Correct</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="streak">0</span>
            <span class="stat-label" data-i18n="streak">Streak</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="avgTime">—</span>
            <span class="stat-label" data-i18n="avgTime">Average time</span>
          </div>
        </div>
        <div class="toolbar">
          <button
            type="button"
            class="settings-btn"
            id="settingsBtn"
            aria-haspopup="dialog"
            aria-expanded="false"
            aria-controls="settingsOverlay"
            data-i18n-aria="settings"
            aria-label="Settings"
          >
            ⚙
          </button>
          <button
            type="button"
            class="pause-btn is-hidden"
            id="pauseBtn"
            aria-pressed="false"
          >
            <span class="play-icon" id="pauseIcon" aria-hidden="true">⏸</span>
            <span id="pauseLabel">Pause</span>
          </button>
          <button
            type="button"
            class="play-btn"
            id="playBtn"
            aria-pressed="false"
          >
            <span class="play-icon" id="playIcon" aria-hidden="true">▶</span>
            <span id="playLabel">Start</span>
          </button>
        </div>
      </header>

      <div class="settings-overlay is-hidden" id="settingsOverlay">
        <div
          class="settings-dialog"
          role="dialog"
          aria-modal="true"
          aria-labelledby="settingsTitle"
        >
          <div class="settings-head">
            <h2 id="settingsTitle" data-i18n="settings">Settings</h2>
            <button type="button" class="settings-close" id="settingsClose" data-i18n="close">
              Close
            </button>
          </div>

          <section class="lang-bar" data-i18n-aria="language" aria-label="Language">
            <button type="button" data-lang="en" aria-pressed="false">EN</button>
            <button type="button" data-lang="it" aria-pressed="false">IT</button>
            <button type="button" data-lang="es" aria-pressed="false">ES</button>
            <button type="button" data-lang="pt" aria-pressed="false">PT</button>
            <button type="button" data-lang="de" aria-pressed="false">DE</button>
            <button type="button" data-lang="fr" aria-pressed="false">FR</button>
            <button type="button" data-lang="zh" aria-pressed="false">中文</button>
            <button type="button" data-lang="ja" aria-pressed="false">日本語</button>
          </section>

          <section class="controls" data-i18n-aria="settings" aria-label="Settings">
            <fieldset class="clef-field">
              <legend data-i18n="clef">Clef</legend>
              <div class="segmented" role="group" data-i18n-aria="clefGroup" aria-label="Musical clef">
                <button type="button" class="seg-btn is-active" data-clef="treble" aria-pressed="true">
                  <span class="seg-glyph">𝄞</span>
                  <span data-i18n="clefTreble">Treble</span>
                </button>
                <button type="button" class="seg-btn is-active" data-clef="bass" aria-pressed="true">
                  <span class="seg-glyph">𝄢</span>
                  <span data-i18n="clefBass">Bass</span>
                </button>
              </div>
            </fieldset>

            <fieldset class="clef-field">
              <legend data-i18n="shape">Exercise</legend>
              <div class="segmented" role="group" data-i18n-aria="shapeGroup" aria-label="Notes, dyads, and chords">
                <button type="button" class="seg-btn is-active" data-shape="notes" aria-pressed="true">
                  <span data-i18n="shapeNotes">Notes</span>
                </button>
                <button type="button" class="seg-btn" data-shape="dyads" aria-pressed="false">
                  <span data-i18n="shapeDyads">Dyads</span>
                </button>
                <button type="button" class="seg-btn" data-shape="chords" aria-pressed="false">
                  <span data-i18n="shapeChords">Chords</span>
                </button>
              </div>
            </fieldset>

            <div class="tempo-field">
              <span class="tempo-heading">
                <span data-i18n="roundsSetting">Number of notes</span>
                <strong id="roundsLabel">10</strong>
              </span>
              <div class="tempo-stepper">
                <button type="button" id="roundsDown" data-i18n-aria="roundsDown" aria-label="Fewer notes">
                  −
                </button>
                <input
                  id="rounds"
                  type="range"
                  min="5"
                  max="30"
                  step="5"
                  value="10"
                  tabindex="-1"
                />
                <button type="button" id="roundsUp" data-i18n-aria="roundsUp" aria-label="More notes">
                  +
                </button>
              </div>
            </div>

            <div class="tempo-field">
              <span class="tempo-heading">
                <span data-i18n="tempo">Time between notes</span>
                <strong id="tempoLabel">4.0 s</strong>
              </span>
              <div class="tempo-stepper">
                <button type="button" id="tempoDown" data-i18n-aria="tempoDown" aria-label="Decrease time">
                  −
                </button>
                <input
                  id="tempo"
                  type="range"
                  min="1"
                  max="15"
                  step="0.5"
                  value="4"
                  tabindex="-1"
                />
                <button type="button" id="tempoUp" data-i18n-aria="tempoUp" aria-label="Increase time">
                  +
                </button>
              </div>
              <span class="tempo-hints">
                <span data-i18n="harder">Harder</span>
                <span data-i18n="easier">Easier</span>
              </span>
            </div>

            <button
              type="button"
              class="seg-btn sound-btn"
              id="soundBtn"
              aria-pressed="true"
              data-i18n-aria="soundAria"
              aria-label="Play the pitched note when it appears"
            >
              <span class="seg-glyph" aria-hidden="true">♪</span>
              <span id="soundLabel">On</span>
            </button>
          </section>
        </div>
      </div>

      <div class="result-overlay is-hidden" id="resultOverlay">
        <div
          class="result-dialog"
          role="dialog"
          aria-modal="true"
          aria-labelledby="resultGrade"
        >
          <div class="result-score">
            <p class="result-kicker" data-i18n="finalGrade">Final grade</p>
            <p class="result-grade" id="resultGrade">—</p>
            <p class="result-label" id="resultLabel"></p>
          </div>
          <p class="result-summary" id="resultSummary"></p>
          <button type="button" class="start-btn" id="playAgainBtn" data-i18n="playAgain">
            Play again
          </button>
        </div>
      </div>

      <main class="stage">
        <div class="manuscript">
          <svg
            id="staff"
            class="staff"
            viewBox="0 0 820 280"
            role="img"
            data-i18n-aria="staffAria"
            aria-label="Staff with the note to guess"
          ></svg>
          <div class="timer" aria-hidden="true">
            <div class="timer-track">
              <div class="timer-fill" id="timerFill"></div>
            </div>
          </div>
          <div class="pause-overlay is-hidden" id="pauseOverlay">
            <p data-i18n="paused">Paused</p>
          </div>
          <p class="quality-hint is-hidden" id="qualityHint"></p>
          <div class="start-overlay" id="startOverlay">
            <p id="overlayHint">10 notes. Choose the clef and the time, then start.</p>
          </div>
        </div>

        <div class="guesses" role="group" data-i18n-aria="pickNote" aria-label="Choose the note">
          <button type="button" class="note-btn" data-note="Do">Do</button>
          <button type="button" class="note-btn" data-note="Re">Re</button>
          <button type="button" class="note-btn" data-note="Mi">Mi</button>
          <button type="button" class="note-btn" data-note="Fa">Fa</button>
          <button type="button" class="note-btn" data-note="Sol">Sol</button>
          <button type="button" class="note-btn" data-note="La">La</button>
          <button type="button" class="note-btn" data-note="Si">Si</button>
        </div>
      </main>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
    <script src="js/tv.js"></script>
  </body>
</html>
